[package]
name = "mini-media-server-addon"
version = "0.0.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
env_logger = "0.11.11"
log = "0.4.33"
quick-xml = "0.41.0"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "fs"] }
tower-http = { version = "0.7.0", features = ["fs", "cors"] }
